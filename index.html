<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Menu Nintendo DS</title>
    <style>
        /* Style ultra-basique compatible vieux navigateurs (Opera 8) */
        body {
            background-color: #000080; /* Bleu rétro inspiré du menu DS */
            color: #ffffff;
            font-family: sans-serif;
            font-size: 12px;
            margin: 0;
            padding: 5px;
            text-align: center;
        }

        h1 {
            font-size: 14px;
            color: #ffff00;
            margin: 5px 0;
        }

        .container {
            width: 240px; /* Adapté à la largeur de l'écran de la DS */
            margin: 0 auto;
        }

        /* Boutons larges faciles à cliquer avec le stylet */
        .ds-button {
            display: block;
            background-color: #c0c0c0;
            color: #000000;
            border: 2px solid #ffffff;
            padding: 8px;
            margin: 6px 0;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
        }

        .ds-button:hover {
            background-color: #ffffff;
            color: #000080;
        }

        .footer {
            font-size: 10px;
            color: #c0c0c0;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mon Portail DS</h1>
        <p>Bienvenue sur ta page web optimisee !</p>

        <!-- Liens sous forme de gros boutons tactiles -->
        <a class="ds-button" href="http://www.google.com">Rechercher (Google)</a>
        <a class="ds-button" href="#section2">Notes / Astuces</a>
        <a class="ds-button" href="#contact">A propos</a>

        <div style="background-color: #000060; border: 1px solid #ffffff; padding: 5px; margin-top: 10px; text-align: left;">
            <a name="section2"></a>
            <strong>Infos :</strong><br>
            Ce site utilise un design en HTML/CSS pur compatible avec le navigateur Opera de la DS.
        </div>

        <div class="footer">
            &copy; 2026 - Retro Web DS
        </div>
    </div>

    <!-- Script JS simple si besoin -->
    <script>
        // Petit script de test compatible JS 1.5
        function alerteDS() {
            alert("La DS execute du JavaScript !");
        }
    </script>
    <br>
    <button onclick="alerteDS()" style="background:#c0c0c0; border:1px solid #000;">Test JS</button>

</body>
</html>

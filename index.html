<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DS Portal Games</title>
    <style>
        body {
            background-color: #000040;
            color: #ffffff;
            font-family: monospace;
            font-size: 11px;
            margin: 0;
            padding: 4px;
            text-align: center;
        }
        h1 { font-size: 13px; color: #ffff00; margin: 4px 0; }
        
        .vue { display: none; }
        .vue.actif { display: block; }

        .ds-menu-btn {
            display: block;
            background-color: #c0c0c0;
            color: #000000;
            border: 2px solid #ffffff;
            padding: 8px;
            margin: 6px auto;
            width: 200px;
            font-weight: bold;
            text-decoration: none;
            font-size: 11px;
        }
        .ds-menu-btn:active { background-color: #ffffff; }

        /* Style pour Snake */
        #ecranJeu {
            background-color: #111111;
            border: 1px solid #00ff00;
            width: 230px;
            height: 85px;
            margin: 2px auto;
            font-family: monospace;
            font-size: 9px;
            line-height: 8px;
            text-align: left;
            overflow: hidden;
            white-space: pre;
            color: #00ff00;
        }
        .ds-btn {
            display: inline-block;
            background-color: #222222;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 3px 6px;
            font-size: 10px;
            font-weight: bold;
            text-decoration: none;
            margin: 1px;
        }

        /* Style pour le Morpion */
        .morpion-grille {
            margin: 10px auto;
            border-collapse: collapse;
        }
        .morpion-grille td {
            width: 35px;
            height: 35px;
            border: 2px solid #ffffff;
            text-align: center;
            vertical-align: middle;
        }
        .morpion-btn {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #000060;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            line-height: 33px;
        }
    </style>
</head>
<body>

    <!-- ================= VUE 1 : MENU PRINCIPAL ================= -->
    <div id="vue-menu" class="vue actif">
        <h1>DS PORTAL MENU</h1>
        <p style="font-size:10px; color:#ccc;">Choisis un jeu au stylet :</p>
        
        <a class="ds-menu-btn" href="javascript:changerVue('vue-snake'); demarrerSnake();">🐍 Snake Turbo</a>
        <a class="ds-menu-btn" href="javascript:changerVue('vue-morpion'); initialiserMorpion();">❌ Morpion (Tic-Tac-Toe)</a>
        
        <div style="margin-top: 15px; font-size: 9px; color: #888;">
            Navigateur DS - Opera Engine
        </div>
    </div>


    <!-- ================= VUE 2 : SNAKE ================= -->
    <div id="vue-snake" class="vue">
        <h1>SNAKE DS</h1>
        <div>Score: <span id="score">0</span></div>

        <div id="ecranJeu">Chargement...</div>

        <div>
            <a class="ds-btn" href="javascript:dir('HAUT')">^ HAUT</a><br>
            <a class="ds-btn" href="javascript:dir('GAUCHE')">&lt;</a>
            <a class="ds-btn" href="javascript:dir('DROITE')">&gt;</a><br>
            <a class="ds-btn" href="javascript:dir('BAS')">v BAS</a>
        </div>
        
        <div style="margin-top: 4px;">
            <a class="ds-btn" href="javascript:changerVue('vue-menu'); arreterSnake();" style="background:#550000; color:#ff9999;">RETOUR MENU</a>
        </div>
    </div>


    <!-- ================= VUE 3 : MORPION ================= -->
    <div id="vue-morpion" class="vue">
        <h1>MORPION DS</h1>
        <div id="morpionStatut" style="font-size: 10px; color: #ffff00; margin: 2px;">À toi de jouer (X)</div>
        
        <table class="morpion-grille">
            <tr>
                <td><a class="morpion-btn" href="javascript:jouerCase(0)" id="c0"></a></td>
                <td><a class="morpion-btn" href="javascript:jouerCase(1)" id="c1"></a></td>
                <td><a class="morpion-btn" href="javascript:jouerCase(2)" id="c2"></a></td>
            </tr>
            <tr>
                <td><a class="morpion-btn" href="javascript:jouerCase(3)" id="c3"></a></td>
                <td><a class="morpion-btn" href="javascript:jouerCase(4)" id="c4"></a></td>
                <td><a class="morpion-btn" href="javascript:jouerCase(5)" id="c5"></a></td>
            </tr>
            <tr>
                <td><a class="morpion-btn" href="javascript:jouerCase(6)" id="c6"></a></td>
                <td><a class="morpion-btn" href="javascript:jouerCase(7)" id="c7"></a></td>
                <td><a class="morpion-btn" href="javascript:jouerCase(8)" id="c8"></a></td>
            </tr>
        </table>

        <div style="margin-top: 6px;">
            <a class="ds-btn" href="javascript:initialiserMorpion()">Recommencer</a><br>
            <a class="ds-btn" href="javascript:changerVue('vue-menu')" style="background:#550000; color:#ff9999; margin-top:4px;">RETOUR MENU</a>
        </div>
    </div>


<script>
    // --- GESTION DES VUES ---
    function changerVue(nomVue) {
        var vues = document.getElementsByClassName('vue');
        for(var i = 0; i < vues.length; i++) {
            vues[i].className = 'vue';
        }
        document.getElementById(nomVue).className = 'vue actif';
    }

    // --- MOTEUR SNAKE ---
    var l = 38, h = 11;
    var snake = [], dirActuelle = 'DROITE', prompDir = 'DROITE';
    var nourX = 5, nourY = 5, score = 0, timer = null, enJeu = false;

    function demarrerSnake() {
        if(enJeu) return;
        snake = [{x:10, y:5}, {x:9, y:5}, {x:8, y:5}];
        dirActuelle = 'DROITE'; prompDir = 'DROITE';
        score = 0;
        document.getElementById('score').innerHTML = score;
        enJeu = true;
        genererNourriture();
        if(timer) clearInterval(timer);
        timer = setInterval(boucleSnake, 300);
    }

    function arreterSnake() {
        enJeu = false;
        if(timer) clearInterval(timer);
    }

    function dir(d) {
        if(d === 'HAUT' && dirActuelle !== 'BAS') prompDir = 'HAUT';
        if(d === 'BAS' && dirActuelle !== 'HAUT') prompDir = 'BAS';
        if(d === 'GAUCHE' && dirActuelle !== 'DROITE') prompDir = 'GAUCHE';
        if(d === 'DROITE' && dirActuelle !== 'GAUCHE') prompDir = 'DROITE';
    }

    function genererNourriture() {
        nourX = Math.floor(Math.random() * (l - 2)) + 1;
        nourY = Math.floor(Math.random() * (h - 2)) + 1;
    }

    function boucleSnake() {
        dirActuelle = prompDir;
        var tete = {x: snake[0].x, y: snake[0].y};
        
        if(dirActuelle === 'HAUT') tete.y--;
        if(dirActuelle === 'BAS') tete.y++;
        if(dirActuelle === 'GAUCHE') tete.x--;
        if(dirActuelle === 'DROITE') tete.x++;

        if(tete.x <= 0 || tete.x >= l-1 || tete.y <= 0 || tete.y >= h-1) {
            finSnake(); return;
        }
        for(var i=0; i<snake.length; i++) {
            if(snake[i].x === tete.x && snake[i].y === tete.y) { finSnake(); return; }
        }

        snake.unshift(tete);
        if(tete.x === nourX && tete.y === nourY) {
            score += 10;
            document.getElementById('score').innerHTML = score;
            genererNourriture();
        } else {
            snake.pop();
        }

        redessinerSnake();
    }

    function redessinerSnake() {
        var buffer = "";
        for(var y=0; y<h; y++) {
            var ligne = "";
            for(var x=0; x<l; x++) {
                if(x === 0 || x === l-1 || y === 0 || y === h-1) {
                    ligne += "#";
                } else if(x === nourX && y === nourY) {
                    ligne += "O";
                } else {
                    var estSerpent = false;
                    for(var i=0; i<snake.length; i++) {
                        if(snake[i].x === x && snake[i].y === y) { estSerpent = true; break; }
                    }
                    ligne += estSerpent ? "X" : " ";
                }
            }
            buffer += ligne + "\n";
        }
        document.getElementById('ecranJeu').innerHTML = buffer;
    }

    function finSnake() {
        enJeu = false;
        clearInterval(timer);
        alert("Game Over ! Score : " + score);
        changerVue('vue-menu');
    }

    // --- MOTEUR MORPION ---
    var plateau = ["", "", "", "", "", "", "", "", ""];
    var tourJoueur = true; // true = X (joueur), false = O (ordi)
    var jeuMorpionActif = true;

    function initialiserMorpion() {
        plateau = ["", "", "", "", "", "", "", "", ""];
        tourJoueur = true;
        jeuMorpionActif = true;
        document.getElementById("morpionStatut").innerHTML = "À toi de jouer (X)";
        for(var i=0; i<9; i++) {
            document.getElementById("c" + i).innerHTML = "";
        }
    }

    function jouerCase(index) {
        if(!jeuMorpionActif || plateau[index] !== "" || !tourJoueur) return;

        plateau[index] = "X";
        document.getElementById("c" + index).innerHTML = "X";

        if(verifierVictoire("X")) {
            document.getElementById("morpionStatut").innerHTML = "Victoire ! GAGNÉ !";
            jeuMorpionActif = false;
            return;
        }
        if(verifierNul()) {
            document.getElementById("morpionStatut").innerHTML = "Match nul !";
            jeuMorpionActif = false;
            return;
        }

        tourJoueur = false;
        document.getElementById("morpionStatut").innerHTML = "L'ordinateur réfléchit...";
        setTimeout(tourOrdi, 500);
    }

    function tourOrdi() {
        if(!jeuMorpionActif) return;

        // Trouver les cases vides
        var vides = [];
        for(var i=0; i<9; i++) {
            if(plateau[i] === "") vides.push(i);
        }

        if(vides.length > 0) {
            // Choix aléatoire simple pour l'ordi
            var choix = vides[Math.floor(Math.random() * vides.length)];
            plateau[choix] = "O";
            document.getElementById("c" + choix).innerHTML = "O";

            if(verifierVictoire("O")) {
                document.getElementById("morpionStatut").innerHTML = "L'ordinateur a gagné !";
                jeuMorpionActif = false;
                return;
            }
            if(verifierNul()) {
                document.getElementById("morpionStatut").innerHTML = "Match nul !";
                jeuMorpionActif = false;
                return;
            }
        }

        tourJoueur = true;
        document.getElementById("morpionStatut").innerHTML = "À toi de jouer (X)";
    }

    function verifierVictoire(symbole) {
        var combi = [
            [0,1,2], [3,4,5], [6,7,8], // Lignes
            [0,3,6], [1,4,7], [2,5,8], // Colonnes
            [0,4,8], [2,4,6]           // Diagonales
        ];
        for(var i=0; i<combi.length; i++) {
            var c = combi[i];
            if(plateau[c[0]] === symbole && plateau[c[1]] === symbole && plateau[c[2]] === symbole) {
                return true;
            }
        }
        return false;
    }

    function verifierNul() {
        for(var i=0; i<9; i++) {
            if(plateau[i] === "") return false;
        }
        return true;
    }
</script>

</body>
</html>

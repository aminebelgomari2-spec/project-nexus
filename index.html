<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Snake DS Ultra</title>
    <style>
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: monospace;
            font-size: 11px;
            margin: 0;
            padding: 2px;
            text-align: center;
        }
        h1 { font-size: 12px; margin: 2px 0; color: #00ff00; }
        #ecranJeu {
            background-color: #111111;
            border: 1px solid #00ff00;
            width: 230px;
            height: 90px;
            margin: 4px auto;
            font-family: monospace;
            font-size: 9px;
            line-height: 8px;
            text-align: left;
            overflow: hidden;
            white-space: pre;
        }
        /* Style des boutons faits avec des liens (ultra-compatible DS) */
        .ds-btn {
            display: inline-block;
            background-color: #222222;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 4px 8px;
            font-size: 10px;
            font-weight: bold;
            text-decoration: none;
            margin: 2px;
        }
        .ds-btn:active {
            background-color: #00ff00;
            color: #000000;
        }
    </style>
</head>
<body>

    <h1>SNAKE DS</h1>
    <div>Score: <span id="score">0</span></div>

    <div id="ecranJeu">Appuie sur START !</div>

    <!-- Utilisation de liens <a> au lieu de <button> pour forcer la compatibilité tactile de la DS -->
    <div>
        <a class="ds-btn" href="javascript:dir('HAUT');">^ HAUT</a><br>
        <a class="ds-btn" href="javascript:dir('GAUCHE');">&lt; GAUCHE</a>
        <a class="ds-btn" href="javascript:dir('DROITE');">DROITE &gt;</a><br>
        <a class="ds-btn" href="javascript:dir('BAS');">v BAS</a>
    </div>
    <div style="margin-top:4px;">
        <a class="ds-btn" href="javascript:demarrer();" style="background:#003300; color:#ffff00;">START</a>
    </div>

<script>
var l = 38;
var h = 11;
var snake = [];
var dirActuelle = 'DROITE';
var prompDir = 'DROITE';
var nourX = 5, nourY = 5;
var score = 0;
var timer = null;
var enJeu = false;

function demarrer() {
    if(enJeu) return;
    snake = [{x:10, y:5}, {x:9, y:5}, {x:8, y:5}];
    dirActuelle = 'DROITE';
    prompDir = 'DROITE';
    score = 0;
    document.getElementById('score').innerHTML = score;
    enJeu = true;
    genererNourriture();
    if(timer) clearInterval(timer);
    timer = setInterval(boucle, 300); // 300ms pour laisser largement le temps à la DS
}

function dir(d) {
    if(d === 'HAUT' && dirActuelle !== 'BAS') prompDir = 'HAUT';
    if(d === 'BAS' && dirActuelle !== 'HAUT') prompDir = 'BAS';
    if(d === 'GAUCHE' && dirActuelle !== 'DROITE') prompDir = 'GAUCHE';
    if(d === 'DROITE' && dirActuelle !== 'GAUCHE') prompDir = 'DROITE';
    
    // Si le jeu n'a pas commencé, le bouton START lance aussi le jeu
    if(!enJeu) demarrer();
}

function genererNourriture() {
    nourX = Math.floor(Math.random() * (l - 2)) + 1;
    nourY = Math.floor(Math.random() * (h - 2)) + 1;
}

function boucle() {
    dirActuelle = prompDir;
    var tete = {x: snake[0].x, y: snake[0].y};
    
    if(dirActuelle === 'HAUT') tete.y--;
    if(dirActuelle === 'BAS') tete.y++;
    if(dirActuelle === 'GAUCHE') tete.x--;
    if(dirActuelle === 'DROITE') tete.x++;

    if(tete.x <= 0 || tete.x >= l-1 || tete.y <= 0 || tete.y >= h-1) {
        fin(); return;
    }
    for(var i=0; i<snake.length; i++) {
        if(snake[i].x === tete.x && snake[i].y === tete.y) { fin(); return; }
    }

    snake.unshift(tete);
    if(tete.x === nourX && tete.y === nourY) {
        score += 10;
        document.getElementById('score').innerHTML = score;
        genererNourriture();
    } else {
        snake.pop();
    }

    redessiner();
}

function redessiner() {
    var buffer = "";
    for(var y=0; y<h; y++) {
        var ligne = "";
        for(var x=0; x<l; x++) {
            if(x === 0 || x === l-1 || y === 0 || y === h-1) {
                ligne += "#";
            } else if(x === nourX && y === nourY) {
                ligne += "O";
            } else {
                var estSerpent = false;
                for(var i=0; i<snake.length; i++) {
                    if(snake[i].x === x && snake[i].y === y) {
                        estSerpent = true;
                        break;
                    }
                }
                ligne += estSerpent ? "X" : " ";
            }
        }
        buffer += ligne + "\n";
    }
    document.getElementById('ecranJeu').innerHTML = buffer;
}

function fin() {
    enJeu = false;
    clearInterval(timer);
    alert("Game Over ! Score : " + score);
}
</script>

</body>
</html>
